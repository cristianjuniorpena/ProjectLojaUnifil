<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior's shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="cabecalho">
        <article class="titulo-prin">
            <h2>Junior's shop</h2>
            <i class="fa-solid fa-bag-shopping"></i>
        </article>
        <nav class="navbar">
            <ul><a href="">Sobre</a><a href="">Produtos</a><a href="">Suporte</a><a href="" class="login">Entrar</a><a href="" class="login">Cadastrar</a></ul>
        </nav>
    </header>

    <main class="main">
        <section class="apresentacao">
            <h3>Esta é a Junior's shop</h3>
            <p>Aqui você irá encontrar vários produtos de seu interesses</p>
        </section>
        <section class="vendas">
            <h3>Produtos em destaque:</h3>
            <div class="produtos" id="produtos">
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="rodape-div">
            <h3>Junior's shop</h3>
            <span>Uma loja para toda a família</span>
        </div>
        <div class="rodape-div">
            <h3>Contatos:</h3>
            <span>43 93284-0234</span>
            <span>llllllllllll</span>
        </div>
        <div class="rodape-div">
            <h3>Atendimento:</h3>
            <span>24 horas</span>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
